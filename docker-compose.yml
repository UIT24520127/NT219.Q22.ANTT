version: '3.8'

services:

  # 1. MariaDB — giữ nguyên
  db:
    image: mariadb:10.11
    container_name: drm_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: drm_system
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./data/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db-subnet
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. OpenBao KMS — giữ nguyên
  openbao:
    image: quay.io/openbao/openbao:2.0
    container_name: drm_kms
    environment:
      VAULT_TOKEN: ${BAO_PRODUCTION_TOKEN}
      BAO_ADDR: "http://0.0.0.0:8200"
    volumes:
      - ./security/config:/vault/config
      - ./data/kms-store:/vault/file
    command: server -config=/vault/config/bao-config.hcl
    networks:
      - private-subnet

  # 3. Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: drm_auth
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${DOMAIN}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      #KC_PROXY: edge
      KC_PROXY_HEADERS: "xforwarded"
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://db:3306/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: ${DB_ROOT_PASSWORD}
      KC_DB_SCHEMA: keycloak
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm.json:ro
    command: start --import-realm
    networks:
      - private-subnet
      - db-subnet

  # 4. Next.js App
  app:
    build:
      context: ./app-core
    container_name: drm_app
    env_file:
      - .env
    command: npm start
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      DB_NAME: drm_system
      DATABASE_URL: "mysql://root:${DB_ROOT_PASSWORD}@db:3306/drm_system"

      BAO_ADDR: "http://openbao:8200"
      BAO_DEV_ROOT_TOKEN_ID: ${BAO_PRODUCTION_TOKEN}
      KMS_TRANSIT_KEY_NAME: "music-app-key"

      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/drm-realm"          # internal — dùng để fetch JWKS
      KEYCLOAK_PUBLIC_ISSUER: "https://${DOMAIN}/realms/drm-realm"     # public — khớp iss claim trong token
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_SECRET: ${KEYCLOAK_SECRET}
      KEYCLOAK_FRONTEND_CLIENT_ID: "frontend-client"
      KEYCLOAK_FRONTEND_SECRET: ""

      KEYCLOAK_DPOP_PRIVATE_JWK: ${KEYCLOAK_DPOP_PRIVATE_JWK}
      DPOP_MAX_AGE: ${DPOP_MAX_AGE:-120}

      APP_URL: "https://${DOMAIN}"

      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_REGION: auto
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_ENDPOINT: "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      NODE_ENV: production

    volumes:
      - /app/node_modules
      - ./security/certificates/certs:/app/certs:ro
      - audio_segments:/app/public/audio

    depends_on:
      db:
        condition: service_healthy
      # openbao và keycloak chưa có healthcheck — fix sau

    networks:
      - private-subnet
      - db-subnet

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 5. Nginx — mount cert từ project thay vì /etc/nginx/ssl/
  nginx:
    image: nginx:latest
    container_name: drm_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./security/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - /etc/nginx/ssl/key.pem:/etc/nginx/ssl/key.pem:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - public-subnet
      - private-subnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 6. Prometheus — giữ nguyên
  prometheus:
    image: prom/prometheus:latest
    container_name: drm_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    depends_on:
      - app
    networks:
      - private-subnet

  # 7. Grafana — giữ nguyên
  grafana:
    image: grafana/grafana:latest
    container_name: drm_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clock-panel
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - private-subnet

networks:
  public-subnet:
    driver: bridge
  private-subnet:
    driver: bridge
  db-subnet:
    driver: bridge
    internal: true

volumes:
  mariadb_data:
  prometheus_data:
  grafana_data:
  audio_segments:
  keycloak_data: