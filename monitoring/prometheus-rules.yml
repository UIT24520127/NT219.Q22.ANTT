groups:
  - name: license-alerts
    interval: 30s
    rules:
      # Alert when license failures exceed threshold
      - alert: HighLicenseFailureRate
        expr: |
          rate(license_failed_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
          component: license
        annotations:
          summary: "High license grant failure rate detected"
          description: "License failure rate is {{ $value }} failures/second over the last 5 minutes (threshold: 0.5/s)"

      # Alert for specific failure types
      - alert: LicenseECDHHandshakeFails
        expr: |
          increase(license_failed_total{reason="missing_client_key"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          component: ecdh
        annotations:
          summary: "ECDH handshake failures detected"
          description: "{{ $value }} ECDH handshake failures in the last 5 minutes"

      - alert: LicenseCEKNotFound
        expr: |
          increase(license_failed_total{reason="cek_not_found"}[5m]) > 10
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "CEK not found errors increasing"
          description: "{{ $value }} CEK lookup failures in the last 5 minutes"

      - alert: LicenseProcessingErrors
        expr: |
          increase(license_failed_total{error_type="internal"}[5m]) > 3
        for: 2m
        labels:
          severity: warning
          component: processing
        annotations:
          summary: "License processing errors detected"
          description: "{{ $value }} license processing errors in the last 5 minutes"

      # Slow license processing
      - alert: SlowLicenseProcessing
        expr: |
          histogram_quantile(0.95, rate(license_processing_duration_seconds_bucket[5m])) > 2.0
        for: 5m
        labels:
          severity: warning
          component: license
        annotations:
          summary: "Slow license processing times"
          description: |
            95th percentile processing time is {{ $value | humanizeDuration }}.
            May impact playback experience.

  - name: upload-alerts
    interval: 30s
    rules:
      - alert: HighUploadFailureRate
        expr: |
          (
            rate(upload_total{status="failure"}[5m]) /
            (rate(upload_total{status="success"}[5m]) + rate(upload_total{status="failure"}[5m]) + 0.001)
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          component: upload
        annotations:
          summary: "High upload failure rate detected (>20%)"
          description: |
            Upload failure rate is {{ $value | humanizePercentage }} over the last 5 minutes.

      - alert: UploadFailureSpike
        expr: |
          increase(upload_total{status="failure"}[1m]) > 5
        for: 2m
        labels:
          severity: critical
          component: upload
        annotations:
          summary: "Sudden spike in upload failures"
          description: |
            {{ $value }} upload failures detected in the last minute.

  - name: auth-alerts
    interval: 30s
    rules:
      - alert: UnusualAuthErrors
        expr: |
          increase(auth_login_total{status="failure"}[5m]) > 10
        for: 3m
        labels:
          severity: warning
          component: auth
        annotations:
          summary: "Unusual number of authentication failures"
          description: |
            {{ $value }} login failures detected in the last 5 minutes.

      - alert: RegisterFailures
        expr: |
          increase(auth_register_total{status="failure"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: auth
        annotations:
          summary: "Multiple registration failures"
          description: |
            {{ $value }} registration failures detected.

  - name: api-performance-alerts
    interval: 30s
    rules:
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "Slow API response times detected"
          description: |
            95th percentile response time is {{ $value | humanizeDuration }}.

      - alert: VerySlowAPIResponse
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 5.0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "Very slow API responses (>5s)"
          description: |
            95th percentile response time is {{ $value | humanizeDuration }}.

      - alert: HighErrorRate
        expr: |
          (
            rate(http_errors_total[5m]) /
            (rate(http_request_duration_seconds_count[5m]) + 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High HTTP error rate (>5%)"
          description: |
            Error rate is {{ $value | humanizePercentage }}.

  - name: kms-alerts
    interval: 30s
    rules:
      - alert: KMSDecryptionErrors
        expr: |
          increase(kms_errors_total{operation="decryption"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          component: kms
        annotations:
          summary: "KMS decryption errors detected"
          description: |
            {{ $value }} KMS decryption errors in the last 5 minutes.

      - alert: SlowKMSDecryption
        expr: |
          histogram_quantile(0.95, rate(kms_decryption_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: kms
        annotations:
          summary: "Slow KMS decryption times"
          description: |
            95th percentile decryption time is {{ $value | humanizeDuration }}.

  - name: database-alerts
    interval: 30s
    rules:
      - alert: DatabaseErrors
        expr: |
          increase(db_errors_total[5m]) > 5
        for: 3m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database errors detected"
          description: |
            {{ $value }} database errors in the last 5 minutes.

      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95, rate(db_query_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: |
            95th percentile query time is {{ $value | humanizeDuration }}.

      - alert: DatabaseConnectionPoolNearCapacity
        expr: |
          db_connection_pool_size > 90
        for: 2m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool near capacity"
          description: |
            {{ $value }} connections active in pool (threshold: 100).


      # Performance alerts
      - alert: HighLicenseProcessingTime
        expr: |
          histogram_quantile(0.95, rate(license_processing_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: performance
        annotations:
          summary: "License processing time is high"
          description: "95th percentile license processing time is {{ $value }}s (threshold: 2s)"

  - name: system-alerts
    interval: 30s
    rules:
      # Database connectivity
      - alert: DatabaseQueryErrors
        expr: |
          increase(db_errors_total[5m]) > 5
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database query errors increasing"
          description: "{{ $value }} database errors in the last 5 minutes"

      # KMS availability
      - alert: KMSDecryptionErrors
        expr: |
          increase(kms_errors_total[5m]) > 3
        for: 2m
        labels:
          severity: critical
          component: kms
        annotations:
          summary: "KMS decryption errors detected"
          description: "{{ $value }} KMS errors in the last 5 minutes"

      # High HTTP error rate
      - alert: HighHTTPErrorRate
        expr: |
          sum(rate(http_errors_total[5m])) by (route) > 0.1
        for: 3m
        labels:
          severity: warning
          component: http
        annotations:
          summary: "High HTTP error rate on {{ $labels.route }}"
          description: "Error rate is {{ $value }} errors/second"

      # Active sessions
      - alert: UnusuallyHighActiveSessions
        expr: |
          active_sessions_total > 1000
        for: 5m
        labels:
          severity: warning
          component: sessions
        annotations:
          summary: "Unusually high number of active sessions"
          description: "Currently {{ $value }} active sessions"
