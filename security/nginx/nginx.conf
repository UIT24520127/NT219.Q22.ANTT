# ============================================================================
# NGINX — Secure Media + Auth Delivery
# ============================================================================

limit_req_zone $binary_remote_addr zone=media_limit:10m  rate=100r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=5r/m;

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media_cache:10m
                 max_size=100m inactive=5m use_temp_path=off;

upstream backend {
    server app:3000;
    keepalive 32;
}

# ============================================================================
# HTTP → HTTPS REDIRECT
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================================
# MAIN HTTPS SERVER
# ============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
    client_max_body_size 500M;

    # ========================================================================
    # SECURITY HEADERS
    # ========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' blob: https://*.r2.cloudflarestorage.com; connect-src 'self' https://*.r2.cloudflarestorage.com; worker-src 'self' blob:" always;

    # ========================================================================
    # BLOCK DIRECT MEDIA ACCESS
    # ========================================================================
    location ~ ^/(audio|encrypted-audio|protected) {
        return 403 "Direct media access forbidden.";
    }

    location ~ ^/r2/ {
        return 403 "Internal routing path only.";
    }

    # ========================================================================
    # NEXT.JS HMR WebSocket — dev hot reload qua nginx
    # ========================================================================
    location /_next/webpack-hmr {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400s;
    }

        # ========================================================================
    # NEXT.JS STATIC — KHÔNG cache khi dev (Turbopack hash đổi liên tục)
    # ========================================================================
    location /_next/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ========================================================================
    # AUTH ROUTES — rate limit 5 req/phút/IP (chặn brute-force)
    # ========================================================================
    location ~ ^/api/auth/(login|register|refresh)$ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;

        proxy_connect_timeout 15s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;
    }

    # ========================================================================
    # SIGNED URL API
    # ========================================================================
    location = /api/media/signed-url {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    location = /api/media/signed-urls {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    # ========================================================================
    # OTHER ALLOWED API ROUTES
    # ========================================================================
    # ================================================================
    # MEDIA PROXY — server-side fetch R2, stream về browser
    # ================================================================
    location ~ ^/api/media/proxy {
        limit_req zone=media_limit burst=50 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # stream ngay, không buffer
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location ~ ^/api/(license|ingest|media) {
        limit_req zone=media_limit burst=20 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ========================================================================
    # BLOCK ALL OTHER /api/ ROUTES
    # ========================================================================
    location /api/ {
        return 403 "API endpoint not allowed.";
    }

    # ========================================================================
    # FRONTEND — Next.js pages
    # ========================================================================
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ========================================================================
    # HEALTH CHECK
    # ========================================================================
    location /health {
        access_log off;
        proxy_pass http://backend;
        proxy_http_version 1.1;
    }

    location ~ /\.  { deny all; access_log off; log_not_found off; }
    location ~ ~$   { deny all; access_log off; log_not_found off; }
}